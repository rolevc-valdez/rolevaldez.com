<html lang="es">
<head>

  <script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --text: #f0f0f0;
      --muted: #8a8a9a;
      --accent: #FF6B35;
      --border: #1E2028;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 70px;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    nav a img { height: 180px; width: auto; margin: -20px 0; }
    nav .nav-home {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav .nav-home:hover { color: var(--accent); }

    /* HERO FIJO */
    .sf-page-hero {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background: url('libros_fondo.jpg') center center / cover no-repeat;
    }
    .sf-page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, #0a0a0f 0%, rgba(10,10,15,0.6) 40%, rgba(10,10,15,0.6) 60%, #0a0a0f 100%),
        linear-gradient(to bottom, #0a0a0f 0%, rgba(10,10,15,0.5) 15%, rgba(10,10,15,0.5) 85%, #0a0a0f 100%);
    }

    /* CONTENIDO SCROLLEABLE */
    .sf-page-content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding-top: 120px;
      padding-bottom: 4rem;
    }

    /* HEADER */
    .sf-page-header {
      text-align: center;
      padding: 0 2rem 3rem;
    }
    .sf-page-eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .sf-page-title {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
    }
    .sf-page-title span {
      color: var(--accent);
    }
    .sf-page-subtitle {
      font-size: 1.1rem;
      color: var(--muted);
    }
    .sf-page-subtitle strong { color: var(--text); }
    .sf-etsy-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.8rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: background 0.2s, color 0.2s;
    }
    .sf-etsy-btn:hover { background: var(--accent); color: #fff; }

    /* GALERIA */
    .sf-books {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 2rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .sf-book-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      transition: transform 0.3s;
      width: 240px;
    }
    .sf-book-card:hover { transform: translateY(-8px); }
    .sf-book-img-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      width: 240px;
      height: 320px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
    }
    .sf-book-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.4s;
    }
    .sf-book-card:hover .sf-book-img-wrap img { transform: scale(1.04); }
    .sf-book-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,107,53,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    .sf-book-overlay span {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .sf-book-card:hover .sf-book-overlay { background: rgba(255,107,53,0.5); }
    .sf-book-card:hover .sf-book-overlay span { opacity: 1; transform: translateY(0); }
    .sf-book-title {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    /* BACK TO TOP */
    #back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      text-decoration: none;
      transition: transform 0.2s;
    }
    #back-to-top.visible { display: flex; }
    #back-to-top img { width: 70px; height: 70px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7)); }
    #back-to-top:hover { transform: scale(1.1); }
    #back-to-top span {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    @media (max-width: 768px) {
      .sf-books { gap: 1.5rem; padding: 0 1.2rem 3rem; }
      .sf-book-card { width: 160px; }
      .sf-book-img-wrap { width: 160px; height: 213px; }
    }
  </style>
</head>
